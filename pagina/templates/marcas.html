{% extends "base/base.html" %}

{% block title %}Marcas{% endblock %}

{% block content %}
    <div class="container-fluid pt-2">
        <div class="row justify-content-start align-items-start g-2">
            {% for marca in marcas %}
                <div class="col">
                    <a href="{% url "productos" %}?marca={{marca.id}}" class="card text-decoration-none">
                        <div class="card-body">
                            <h4 class="card-title">{{marca}}</h4>
                        </div>
                    </a>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
